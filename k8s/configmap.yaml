apiVersion: v1
kind: ConfigMap
metadata:
  name: k3s-demo-config
  namespace: k3s-demo
  labels:
    app.kubernetes.io/name: k3s-demo
    app.kubernetes.io/part-of: k3s-demo
data:
  APP_VERSION: "1.0.0"
  GREETING: "Hello from k3s"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
