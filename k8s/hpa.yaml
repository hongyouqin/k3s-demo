apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: k3s-demo
  namespace: k3s-demo
  labels:
    app.kubernetes.io/name: k3s-demo
    app.kubernetes.io/part-of: k3s-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k3s-demo
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Percentage of the pod's CPU request (100m), not of the CPU limit.
          averageUtilization: 50
