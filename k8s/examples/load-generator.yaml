apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: k3s-demo
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/part-of: k3s-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
        app.kubernetes.io/part-of: k3s-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load-generator
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -O /dev/null \
                  "http://k3s-demo.k3s-demo.svc.cluster.local/api/cpu?millis=200" || sleep 1
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
